<!doctype html><html lang='ja'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>○○町デジタル議会</title><style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f7f8;color:#17212b;line-height:1.6}header{background:#102a36;color:white;padding:20px max(18px,calc((100vw - 1080px)/2))}main{max-width:1080px;margin:25px auto;padding:0 18px}.hero,.card{background:white;border:1px solid #dce4e8;border-radius:16px;padding:22px;margin:18px 0}.hero{background:#e7f2f4}.layout{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.topic{border-bottom:1px solid #e2e7eb;padding:15px 0}.topic:last-child{border:0}.tag{display:inline-block;background:#e9f3f5;color:#155e75;border-radius:20px;padding:3px 10px;font-size:.8em}.status{color:#8a5a00;background:#fff4d6;border-radius:20px;padding:3px 10px;font-size:.8em}button{background:#155e75;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700}button.secondary{background:#edf2f4;color:#243b48;border:1px solid #dce4e8}input,select,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cbd5dc;border-radius:8px;font:inherit;margin:5px 0 12px}textarea{min-height:90px}label{font-weight:650}.muted{color:#66737d;font-size:.9em}.comment,.issue{background:#f7f9fa;border-radius:10px;padding:12px;margin:10px 0}.author{color:#6b7780;font-size:.8em}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tab{background:white;color:#24404b;border:1px solid #dce4e8}.tab.active{background:#155e75;color:white}.hidden{display:none}.notice{background:#fff7e5;border:1px solid #e8d6a5;border-radius:10px;padding:12px;font-size:.9em}@media(max-width:780px){.layout{grid-template-columns:1fr}}.topTabs{max-width:1080px;margin:0 auto;padding:0 18px;display:flex;gap:8px}.topTab{flex:1;border-radius:0 0 10px 10px;background:#e8eef1;color:#29414d;border:1px solid #dce4e8;padding:13px}.topTab.active{background:#155e75;color:white;border-color:#155e75}.hidden{display:none!important}.status.votingBadge{background:#fee2e2;color:#b91c1c;font-weight:700}.voteThread{border-top:1px solid #e2e7eb;margin-top:12px;padding-top:12px}
/* Smartphone layout */
@media(max-width:600px){
 body{font-size:16px} header{padding:16px} main{margin:12px auto;padding:0 12px} .card,.hero{padding:16px;border-radius:12px;margin:12px 0} .topTabs{padding:0 8px;gap:4px;flex-wrap:wrap} .topTab{flex:1 1 30%;padding:11px 5px;font-size:.92rem;border-radius:8px} .layout{grid-template-columns:1fr;gap:10px} h2{font-size:1.25rem} h3{font-size:1.08rem;line-height:1.45} .topic{padding:14px 0} .topic .tag,.topic .status{display:inline-block;margin:3px 2px 5px 0} button{padding:12px 14px;min-height:44px;font-size:1rem} .tabs{gap:6px} .tabs button{flex:1 1 auto} input,select,textarea{font-size:16px;padding:12px} .comment,.issue{padding:12px} #detail .tabs{display:flex;flex-wrap:wrap} #detail .tabs .tab{min-width:calc(33% - 8px)} #detail .voteThread{margin-top:14px} #detail .issue .tabs button{width:100%;flex:1 1 100%} }
@media(max-width:380px){.topTab{font-size:.82rem;padding:10px 3px}main{padding:0 8px}.card{padding:13px}#detail .tabs .tab{min-width:100%}}

/* Full-width rectangular navigation tabs */
.topTabs{max-width:none;width:100%;box-sizing:border-box;margin:0;padding:0;gap:0;display:flex;flex-wrap:nowrap;border-bottom:1px solid #dce4e8}
.topTab{flex:1 1 0;border-radius:0;margin:0;border:0;border-right:1px solid #cbd5dc;padding:14px 8px;min-width:0}
.topTab:last-child{border-right:0}
.topTab.active{border-radius:0}
@media(max-width:780px){.topTabs{max-width:none;width:100%;padding:0;gap:0;flex-wrap:nowrap}.topTab{flex:1 1 0;border-radius:0;padding:13px 5px;font-size:.92rem;min-width:0}}
@media(max-width:380px){.topTab{font-size:.8rem;padding:11px 2px}}
</style>
<header><strong style='font-size:1.25rem'>○○町デジタル議会</strong></header><nav class='topTabs'><button class='topTab active' id='tabList' onclick='switchTop("list")'>議題一覧</button><button class='topTab' id='tabSubmit' onclick='switchTop("submit")'>条例提案</button><button class='topTab' id='tabReview' onclick='switchTop("review")'>審査</button></nav><main>

<section id='proposalView'><div class='card' id='listCard'><h2>議題一覧</h2><input id='searchTopic' type='search' placeholder='議題名・内容・分野で検索' oninput='render()'><select id='filter'><option value='all'>すべて</option><option value='discussion'>議論中</option><option value='review'>審査中</option><option value='revision'>修正依頼</option><option value='voting'>投票中</option><option value='closed'>投票終了</option></select><div id='list'></div></div><div class='card hidden' id='threadCard'><button class='secondary' onclick='backToList()'>← 議題一覧に戻る</button><h2>議題スレッド</h2><div id='detail'><p class='muted'>議題を選択してください。</p></div></div></section><section id='submissionView' class='hidden'><aside>
<div class='card'><h2>条例を提案する</h2><p class='muted'>投稿者名は入力不要です。匿名番号は議題ごとに異なる番号で表示されます。</p><form id='form'><label>提案タイトル</label><input id='title' required maxlength='120'><label>分野</label><select id='category'><option>生活・地域</option><option>交通・都市計画</option><option>環境</option><option>教育・子育て</option><option>福祉・健康</option><option>行政・制度</option><option>その他</option></select><label>解決したい問題</label><textarea id='problem' required></textarea><label>条例として提案する内容</label><textarea id='proposal' required></textarea><label>理由・期待される効果</label><textarea id='reason'></textarea><button>審査に提出</button></form></div></section><section id='reviewView' class='hidden'><div class='card'><h2>審査対象一覧</h2><p class='muted'>提出された条例案を公開基準に基づいて確認します。政策への賛否は審査基準にしません。</p><div id='reviewList'></div></div><div class='card'><h2>審査操作（デモ）</h2><p class='muted'>試作のため操作は公開されています。本番では審査権限の管理が必要です。</p><select id='reviewSelect'></select><textarea id='reviewReason' placeholder='審査理由'></textarea><button id='pass'>通過・議論へ</button> <button class='secondary' id='revise'>修正依頼</button> <button class='secondary' id='reject'>不通過</button></div></section><div class='card'><h2>最終投票の操作（デモ）</h2><p class='muted'>議論中の議題を投票に移行できます。投票開始後は議題一覧に「投票中」と表示され、議題を開いて投票できます。操作は試作版です。</p><label>投票を開始する議題</label><select id='voteSelect'></select><label>投票資格者数（仮）</label><input id='eligibleCount' type='number' min='1' value='100'><button id='startVote'>投票を開始</button><p></p><label>締切対象の議題</label><select id='closeVoteSelect'></select><button class='secondary' id='closeVote'>投票を締切</button></div></section></main>
<script>
const seed=[{id:1,title:'自転車専用道路の整備に関する条例案',category:'交通・都市計画',problem:'歩行者と自転車の接触事故や通行上の危険を減らしたい。',proposal:'一定の道路に自転車専用通行空間を整備する基準を設ける。',reason:'安全な移動環境を整える。',status:'discussion',reviewReason:'議論可能な内容と確認。',comments:[{text:'歩行者との分離は重要ですが、交差点設計も検討したい。',uid:1},{text:'整備費と維持費を公開して優先順位を検討したい。',uid:2}],issues:[{name:'安全性',desc:'歩行者との分離、事故防止、交差点対策'},{name:'財政負担',desc:'整備費・維持費と費用対効果'},{name:'交通への影響',desc:'車道幅、渋滞、駐車スペース'}]},{id:2,title:'公園の利用時間に関する条例案',category:'生活・地域',problem:'公園の利用時間と周辺住民への影響の調整。',proposal:'公園ごとの利用時間や静穏時間の基準を定める。',reason:'利用者と近隣双方の環境を確保する。',status:'review',comments:[],issues:[]},{id:3,title:'公共施設への無料Wi-Fi設置に関する条例案',category:'行政・制度',problem:'公共施設で情報アクセス環境に差がある。',proposal:'公共施設のWi-Fi整備方針と利用条件を定める。',reason:'情報アクセスの利便性を向上させる。',status:'revision',reviewReason:'対象施設と整備方針の具体化をお願いします。',comments:[],issues:[]}];
const sample5=[{id:4,title:'夜間の騒音対策に関する条例案',category:'生活・地域',problem:'深夜の騒音によって住民の生活環境が損なわれる場合がある。',proposal:'夜間の騒音に関する相談窓口や、公共空間での配慮事項を定める。',reason:'住民の生活環境と公共空間の利用を両立する。',status:'discussion',comments:[],issues:[]},{id:5,title:'食品ロス削減に関する条例案',category:'環境',problem:'家庭や事業所で食べられる食品が廃棄されている。',proposal:'食品ロス削減の啓発、事業者との連携、情報公開の方針を定める。',reason:'廃棄量の減少と資源の有効利用を目指す。',status:'discussion',comments:[],issues:[]},{id:6,title:'子どもの遊び場確保に関する条例案',category:'教育・子育て',problem:'地域によって子どもが安心して遊べる場所や機会に差がある。',proposal:'公共施設・公園等の遊び場確保と利用上の配慮に関する方針を定める。',reason:'子どもの居場所と遊びの機会を確保する。',status:'discussion',comments:[],issues:[]},{id:7,title:'公共交通の利用支援に関する条例案',category:'交通・都市計画',problem:'高齢者や移動に困難を抱える人が公共交通を利用しづらい場合がある。',proposal:'移動支援施策の検討、関係事業者との連携、利用状況の把握方針を定める。',reason:'地域における移動の選択肢を確保する。',status:'discussion',comments:[],issues:[]},{id:8,title:'公共施設の利用情報公開に関する条例案',category:'行政・制度',problem:'公共施設の予約状況や利用条件が分かりにくい場合がある。',proposal:'施設の利用条件、予約方法、空き状況等の情報公開方針を定める。',reason:'施設利用の透明性と利便性を向上させる。',status:'discussion',comments:[],issues:[]}];let data;try{data=JSON.parse(localStorage.getItem('mnjo_v3'))||[]}catch(e){data=[]}if(!Array.isArray(data))data=[];seed.concat(sample5).forEach(s=>{if(!data.some(x=>x.id===s.id))data.push(JSON.parse(JSON.stringify(s)))});data=data.map(x=>({...x,comments:Array.isArray(x.comments)?x.comments:[],issues:Array.isArray(x.issues)?x.issues:[]}));let demoVoteTopic=data.find(x=>x.id===1);if(demoVoteTopic){demoVoteTopic.status='voting';demoVoteTopic.eligibleCount=100;demoVoteTopic.votes=demoVoteTopic.votes||{yes:0,no:0,abstain:0};}try{localStorage.setItem('mnjo_v3',JSON.stringify(data))}catch(e){}let selected=null;
const labels={discussion:'議論中',review:'審査中',revision:'修正依頼',rejected:'不通過',voting:'投票中',closed:'投票終了'};
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function alias(uid,topic){return '市民'+String((uid*43+topic*17)%997+1).padStart(3,'0')}
function save(){localStorage.setItem('mnjo_v3',JSON.stringify(data));render()}
function render(){let f=document.getElementById('filter').value;let q=(document.getElementById('searchTopic')?.value||'').trim().toLowerCase();let arr=data.filter(x=>(f==='all'||x.status===f)&&(!q||[x.title,x.problem,x.proposal,x.reason,x.category].some(v=>(v||'').toLowerCase().includes(q))));document.getElementById('list').innerHTML=arr.map(x=>`<div class='topic'><span class='tag'>議題 No.${String(x.id).padStart(3,'0')} · ${esc(x.category)}</span> <span class='status ${x.status==='voting'?'votingBadge':''}'>${labels[x.status]||x.status}</span><h3><a href='#' style='color:inherit' onclick='selectTopic(${x.id});return false'>${esc(x.title)}</a></h3>${x.status==='voting'?'<p><b>投票受付中：</b>議題を開いて投票できます。</p>':x.status==='closed'?'<p><b>投票終了：</b>結果を確認できます。</p>':''}<p>${esc(x.problem)}</p><span class='muted'>コメント ${x.comments.length}件</span></div>`).join('')||'<p>該当する議題なし</p>';document.getElementById('reviewList').innerHTML=data.filter(x=>['review','revision'].includes(x.status)).map(x=>`<div class='topic'><span class='tag'>No.${String(x.id).padStart(3,'0')}</span><span class='status'>${labels[x.status]}</span><h3>${esc(x.title)}</h3><p>${esc(x.problem)}</p></div>`).join('')||'<p class=muted>審査対象はありません。</p>';document.getElementById('reviewSelect').innerHTML=data.filter(x=>['review','revision'].includes(x.status)).map(x=>`<option value='${x.id}'>No.${x.id} ${esc(x.title)}</option>`).join('');document.getElementById('voteSelect').innerHTML=data.filter(x=>x.status==='discussion').map(x=>`<option value='${x.id}'>No.${x.id} ${esc(x.title)}</option>`).join('');document.getElementById('closeVoteSelect').innerHTML=data.filter(x=>x.status==='voting').map(x=>`<option value='${x.id}'>No.${x.id} ${esc(x.title)}</option>`).join('')}
function switchTop(which){document.getElementById('proposalView').classList.toggle('hidden',which!=='list');document.getElementById('submissionView').classList.toggle('hidden',which!=='submit');document.getElementById('reviewView').classList.toggle('hidden',which!=='review');document.getElementById('tabList').classList.toggle('active',which==='list');document.getElementById('tabSubmit').classList.toggle('active',which==='submit');document.getElementById('tabReview').classList.toggle('active',which==='review');window.scrollTo({top:0,behavior:'smooth'})}
function selectTopic(id){selected=id;document.getElementById('listCard').classList.add('hidden');document.getElementById('threadCard').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});let x=data.find(a=>a.id===id);let d=document.getElementById('detail');if(x.status==='voting'||x.status==='closed'){d.innerHTML=`<span class='tag'>議題 No.${String(x.id).padStart(3,'0')}</span> <span class='status ${x.status==='voting'?'votingBadge':''}'>${labels[x.status]}</span><h3>${esc(x.title)}</h3><p><b>投票対象条例案</b></p><p>${esc(x.proposal)}</p>${voteCard(x)}<h3>スレッドの書き込み</h3><div class='voteThread'>${(x.comments||[]).map((c,i)=>`<div class='comment'><div class='author'>${alias(c.uid||i+1,x.id)}</div>${esc(c.text)}</div>`).join('')||'<p class=muted>スレッドへの書き込みはありません。</p>'}</div><p class='muted'>投票はこのブラウザ内の試作記録です。本人確認や重複投票防止は未実装です。</p>`;return}if(x.status!=='discussion'){d.innerHTML=`<span class='tag'>議題 No.${String(x.id).padStart(3,'0')}</span> <span class='status'>${labels[x.status]}</span><h3>${esc(x.title)}</h3><p class='muted'>公開議論前の段階です。</p><b>提案内容</b><p>${esc(x.proposal)}</p>${x.reviewReason?'<b>審査理由</b><p>'+esc(x.reviewReason)+'</p>':''}`;return}d.innerHTML=`<span class='tag'>議題 No.${String(x.id).padStart(3,'0')}</span><h3>${esc(x.title)}</h3><p class='muted'>${esc(x.category)} · コメント${x.comments.length}件</p><div class='tabs'><button class='tab active' onclick='tab("comments",this)'>自由討論</button><button class='tab' onclick='tab("issues",this)'>論点整理</button><button class='tab' onclick='tab("summary",this)'>議論の要約（デモ）</button></div><div id='comments'>${x.comments.map((c,i)=>`<div class='comment'><div class='author'>${alias(c.uid||i+1,x.id)}</div>${esc(c.text)}</div>`).join('')}<label>コメントを投稿</label><textarea id='commentInput' placeholder='意見、質問、提案'></textarea><button onclick='addComment(${id})'>投稿する</button></div><div id='issues' class='hidden'>${(x.issues||[]).map(i=>`<div class='issue'><b>${esc(i.name)}</b><p>${esc(i.desc)}</p></div>`).join('')||'<p>論点は未整理です。</p>'}<p class='muted'>分類は整理用で、意見の優劣を示しません。</p></div><div id='summary' class='hidden'><div class='issue'><b>主な意見（簡易表示）</b><p>${esc(x.comments.slice(0,3).map(c=>c.text).join(' ／ ')||'まだ意見はありません。')}</p></div><div class='issue'><b>未解決の問い</b><p>実施方法、影響、費用、課題について追加議論が必要です。</p></div><p class='muted'>AI要約は未実装のデモ表示です。原文コメントは全て閲覧可能です。</p></div>`}
function voteCard(x){let v=x.votes||{yes:0,no:0,abstain:0};let total=v.yes+v.no+v.abstain,need=Math.ceil((x.eligibleCount||100)*.25),valid=total>=need;return `<div class='issue'><b>投票結果 ${x.status==='voting'?'（途中集計）':'（確定集計）'}</b><p>賛成：${v.yes}　反対：${v.no}　棄権：${v.abstain}</p><p>投票参加：${total} / 資格者 ${x.eligibleCount||100}人（成立必要数 ${need}人）</p><p><b>${valid?'投票成立':'投票未成立'}</b>${x.status==='closed'?(valid?(v.yes>v.no?'賛成多数':'反対多数または同数'):'参加率要件未達'):' '}</p>${x.status==='voting'?`<div class='tabs'><button onclick='castVote(${x.id},"yes")'>賛成票を投じる</button><button class='secondary' onclick='castVote(${x.id},"no")'>反対票を投じる</button><button class='secondary' onclick='castVote(${x.id},"abstain")'>棄権する</button></div>`:''}</div>`}
function castVote(id,choice){let x=data.find(a=>a.id===id);if(!x||x.status!=='voting')return;x.votes=x.votes||{yes:0,no:0,abstain:0};x.votes[choice]++;save();if(selected===id)selectTopic(id);alert('投票を記録しました（デモ）。')}
function backToList(){document.getElementById('threadCard').classList.add('hidden');document.getElementById('listCard').classList.remove('hidden');selected=null;window.scrollTo({top:0,behavior:'smooth'});}
function tab(t,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['comments','issues','summary'].forEach(k=>document.getElementById(k).classList.toggle('hidden',k!==t))}
function addComment(id){let x=data.find(a=>a.id===id),v=document.getElementById('commentInput').value.trim();if(!v)return;x.comments.push({text:v,uid:Math.floor(Math.random()*9999)+1});save();selectTopic(id)}
document.getElementById('form').onsubmit=e=>{e.preventDefault();data.push({id:Math.max(0,...data.map(x=>x.id))+1,title:title.value.trim(),category:category.value,problem:problem.value.trim(),proposal:proposal.value.trim(),reason:reason.value.trim(),status:'review',comments:[],issues:[]});e.target.reset();save();alert('審査に提出しました（ブラウザ内に保存）。')};
document.getElementById('filter').onchange=render;function doReview(st,txt){let x=data.find(a=>a.id==Number(reviewSelect.value));if(!x)return;x.status=st;x.reviewReason=reviewReason.value.trim()||txt;if(st==='discussion'&&!x.issues.length)x.issues=[{name:'主な論点',desc:'実施方法、影響、費用、課題について議論してください。'}];reviewReason.value='';save();alert('審査結果を反映しました（試作操作）。')}
document.getElementById('pass').onclick=()=>doReview('discussion','審査通過');document.getElementById('revise').onclick=()=>doReview('revision','修正依頼');document.getElementById('reject').onclick=()=>doReview('rejected','不通過');document.getElementById('startVote').onclick=()=>{let x=data.find(a=>a.id==Number(document.getElementById('voteSelect').value));if(!x)return;x.status='voting';x.eligibleCount=Math.max(1,Number(eligibleCount.value)||100);x.votes=x.votes||{yes:0,no:0,abstain:0};save();alert('投票を開始しました。')};document.getElementById('closeVote').onclick=()=>{let x=data.find(a=>a.id==Number(document.getElementById('closeVoteSelect').value));if(!x||x.status!=='voting'){alert('投票中の議題を選択してください。');return}x.status='closed';save();alert('投票を締め切りました。')};render();
</script></html>
